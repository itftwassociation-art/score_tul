<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Two-Level Scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#101012;
    --panel:#19191b;
    --line: rgba(244,239,228,0.13);
    --ink:#f4efe4;
    --ink-dim: rgba(244,239,228,0.55);
    --red:#b31631; --red-dim:#7e0f22;
    --blue:#163f9e; --blue-dim:#0e2a6e;
    --gold:#c9a24a;
    --danger:#ff5a45;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    height:100vh; height:100dvh; overflow:hidden;
  }
  .app{ display:flex; flex-direction:column; height:100vh; height:100dvh; }

  .topbar{
    flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
    padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line);
  }
  .brand{ display:flex; align-items:baseline; gap:8px; }
  .brand .mark{ font-family:'Oswald',sans-serif; font-weight:600; font-size:15px; letter-spacing:0.04em; color:var(--gold); }
  .brand .sub{ font-size:11px; color:var(--ink-dim); }
  .reset-btn{
    background:transparent; border:1px solid var(--line); color:var(--ink-dim);
    font-size:12px; padding:7px 12px; border-radius:6px; cursor:pointer;
  }
  .reset-btn:hover{ color:var(--ink); border-color:var(--ink-dim); }

  .arena{ flex:1 1 auto; display:flex; min-height:0; }
  .side{ flex:1 1 50%; display:flex; flex-direction:column; min-width:0; position:relative; overflow:hidden; }
  .side.red{ background: linear-gradient(180deg, var(--red) 0%, var(--red-dim) 100%); }
  .side.blue{ background: linear-gradient(180deg, var(--blue) 0%, var(--blue-dim) 100%); }
  .divider{ width:1px; background:rgba(0,0,0,0.4); flex:0 0 auto; }

  .side-head{
    flex:0 0 auto; padding:10px 14px 0;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .name{
    font-family:'Oswald',sans-serif; font-size:15px; font-weight:500; letter-spacing:0.02em;
    background:transparent; border:none; color:var(--ink);
    border-bottom:1px solid transparent; padding:2px 0; width:100%; min-width:0;
  }
  .name:focus{ outline:none; border-bottom-color:rgba(244,239,228,0.5); }
  .dq-badge{
    font-family:'Inter'; font-size:11px; font-weight:700; letter-spacing:0.04em;
    color:var(--danger); background:rgba(0,0,0,0.28); border:1px solid var(--danger);
    padding:3px 8px; border-radius:5px; display:none; white-space:nowrap;
  }
  .dq-badge.show{ display:inline-block; }

  /* mirrored body: outer button column + inner readout column */
  .side-body{ flex:1 1 auto; display:flex; flex-direction:row; min-height:0; }
  .side.blue .side-body{ flex-direction:row-reverse; }

  .btn-col{
    flex:0 0 auto; width:78px; display:flex; flex-direction:column; gap:8px;
    padding:8px; justify-content:center; align-items:stretch;
  }
  .lbtn{
    border-radius:10px; border:1px solid rgba(244,239,228,0.3);
    background: rgba(0,0,0,0.20); color:var(--ink);
    font-family:'Oswald',sans-serif; font-size:15px; font-weight:600;
    padding:14px 2px; cursor:pointer; text-align:center;
  }
  .lbtn small{ display:block; font-family:'Inter'; font-size:9px; font-weight:500; letter-spacing:0.03em; color: rgba(244,239,228,0.65); margin-top:2px; }
  .lbtn:active{ background: rgba(0,0,0,0.36); transform:scale(0.96); }
  .lbtn:disabled{ opacity:0.35; cursor:default; }
  .lbtn.dq{
    background: rgba(255,90,69,0.16); border-color: var(--danger); color: var(--danger);
    font-family:'Inter'; font-size:12px; font-weight:700; letter-spacing:0.03em; padding:12px 2px;
  }
  .lbtn.dq:active{ background: rgba(255,90,69,0.32); }
  .undo-mini{
    background:transparent; border:1px dashed rgba(244,239,228,0.28); color: rgba(244,239,228,0.72);
    border-radius:8px; padding:8px 2px; font-family:'Inter'; font-size:10px; cursor:pointer;
  }
  .undo-mini:disabled{ opacity:0.3; cursor:default; }

  .main-col{ flex:1 1 auto; display:flex; flex-direction:column; min-width:0; min-height:0; justify-content:center; gap:8px; padding:4px 10px; }

  .total-wrap{ display:flex; flex-direction:column; align-items:center; }
  .total-label{ font-family:'Inter'; font-size:11px; letter-spacing:0.05em; color:rgba(244,239,228,0.7); margin-bottom:2px; }
  .total{
    font-family:'Oswald',sans-serif; font-weight:700; font-size:min(15vw, 76px);
    line-height:1; user-select:none;
  }
  .total.zeroed{ color: var(--danger); }

  .readout-row{ display:flex; gap:8px; }
  .readout{
    flex:1; background: rgba(0,0,0,0.20); border:1px solid rgba(244,239,228,0.18);
    border-radius:10px; padding:8px 10px; text-align:center;
  }
  .readout .rtitle{ font-family:'Oswald',sans-serif; font-size:11px; letter-spacing:0.03em; color: rgba(244,239,228,0.75); }
  .readout .rscore{ font-family:'Oswald',sans-serif; font-size:22px; font-weight:600; font-variant-numeric: tabular-nums; }
  .readout .rmax{ font-family:'Inter'; font-size:10px; color: rgba(244,239,228,0.5); }

  .level3-note{
    text-align:center; font-family:'Inter'; font-size:10.5px; color: rgba(244,239,228,0.6);
  }

  .bottombar{
    flex:0 0 auto; display:flex; align-items:center; justify-content:center;
    padding:8px 12px; background:var(--panel); border-top:1px solid var(--line);
    font-family:'Inter'; font-size:11px; color:var(--ink-dim); text-align:center;
  }

  @media (max-width: 620px){
    .total{ font-size:min(13vw, 54px); }
    .readout .rscore{ font-size:18px; }
    .btn-col{ width:62px; }
    .lbtn{ font-size:12.5px; padding:11px 2px; }
    .name{ font-size:13px; }
  }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand">
      <span class="mark">TKD JUDGING</span>
      <span class="sub">two-level scoreboard</span>
    </div>
    <button class="reset-btn" id="resetAllBtn">Reset all</button>
  </div>

  <div class="arena">
    <!-- RED -->
    <div class="side red" data-side="red">
      <div class="side-head">
        <input class="name" id="nameRed" value="Red" maxlength="16">
        <span class="dq-badge" id="dqBadgeRed">DQ · 0</span>
      </div>
      <div class="side-body">
        <div class="btn-col">
          <button class="lbtn" data-side="red" data-action="l1minus">−0.2<small>LEVEL 1</small></button>
          <button class="lbtn" data-side="red" data-action="l2plus">+0.5<small>LEVEL 2</small></button>
          <button class="lbtn dq" data-side="red" data-action="dq">DQ<small style="color:var(--danger)">LEVEL 3</small></button>
          <button class="undo-mini" data-side="red" id="undoRed">Undo last</button>
        </div>
        <div class="main-col">
          <div class="total-wrap">
            <div class="total-label">TOTAL</div>
            <div class="total" id="totalRed">6.0</div>
          </div>
          <div class="readout-row">
            <div class="readout">
              <div class="rtitle">LEVEL 1</div>
              <div class="rscore" id="l1Red">6.0</div>
              <div class="rmax">/ 6.0</div>
            </div>
            <div class="readout">
              <div class="rtitle">LEVEL 2</div>
              <div class="rscore" id="l2Red">0.0</div>
              <div class="rmax">/ 4.0</div>
            </div>
          </div>
          <div class="level3-note">Level 3 — DQ zeroes the total score</div>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- BLUE -->
    <div class="side blue" data-side="blue">
      <div class="side-head">
        <input class="name" id="nameBlue" value="Blue" maxlength="16">
        <span class="dq-badge" id="dqBadgeBlue">DQ · 0</span>
      </div>
      <div class="side-body">
        <div class="btn-col">
          <button class="lbtn" data-side="blue" data-action="l1minus">−0.2<small>LEVEL 1</small></button>
          <button class="lbtn" data-side="blue" data-action="l2plus">+0.5<small>LEVEL 2</small></button>
          <button class="lbtn dq" data-side="blue" data-action="dq">DQ<small style="color:var(--danger)">LEVEL 3</small></button>
          <button class="undo-mini" data-side="blue" id="undoBlue">Undo last</button>
        </div>
        <div class="main-col">
          <div class="total-wrap">
            <div class="total-label">TOTAL</div>
            <div class="total" id="totalBlue">6.0</div>
          </div>
          <div class="readout-row">
            <div class="readout">
              <div class="rtitle">LEVEL 1</div>
              <div class="rscore" id="l1Blue">6.0</div>
              <div class="rmax">/ 6.0</div>
            </div>
            <div class="readout">
              <div class="rtitle">LEVEL 2</div>
              <div class="rscore" id="l2Blue">0.0</div>
              <div class="rmax">/ 4.0</div>
            </div>
          </div>
          <div class="level3-note">Level 3 — DQ zeroes the total score</div>
        </div>
      </div>
    </div>
  </div>

  <div class="bottombar">Level 1 starts at 6.0 · Level 2 starts at 0.0 · Level 3 DQ zeroes the total</div>
</div>

<script>
(function(){
  const L1_MAX = 6.0, L1_STEP = 0.2;
  const L2_MAX = 4.0, L2_STEP = 0.5;

  const sides = ['red','blue'];
  const state = {
    red:  { l1: L1_MAX, l2: 0, dq:false, history:[] },
    blue: { l1: L1_MAX, l2: 0, dq:false, history:[] }
  };

  const round1 = n => Math.round(n*10)/10;
  const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
  const el = id => document.getElementById(id);
  const ids = {};
  sides.forEach(side => {
    ids[side] = {
      total: el('total'+cap(side)),
      l1: el('l1'+cap(side)),
      l2: el('l2'+cap(side)),
      dqBadge: el('dqBadge'+cap(side)),
      undo: el('undo'+cap(side)),
      btns: document.querySelectorAll('.lbtn[data-side="'+side+'"]')
    };
  });

  function render(side){
    const s = state[side];
    const r = ids[side];
    r.l1.textContent = round1(s.l1).toFixed(1);
    r.l2.textContent = round1(s.l2).toFixed(1);
    const totalVal = s.dq ? 0 : round1(s.l1 + s.l2);
    r.total.textContent = totalVal.toFixed(1);
    r.total.classList.toggle('zeroed', s.dq);
    r.dqBadge.classList.toggle('show', s.dq);
    r.undo.disabled = s.history.length === 0;
    r.btns.forEach(b => { if(b.dataset.action !== 'dq') b.disabled = s.dq; });
  }

  function snapshot(side){
    const s = state[side];
    return { l1: s.l1, l2: s.l2, dq: s.dq };
  }

  function l1Minus(side){
    const s = state[side];
    if(s.dq) return;
    s.history.push(snapshot(side));
    s.l1 = round1(Math.max(0, s.l1 - L1_STEP));
    render(side);
  }

  function l2Plus(side){
    const s = state[side];
    if(s.dq) return;
    s.history.push(snapshot(side));
    s.l2 = round1(Math.min(L2_MAX, s.l2 + L2_STEP));
    render(side);
  }

  function dq(side){
    const s = state[side];
    if(s.dq) return;
    s.history.push(snapshot(side));
    s.dq = true;
    render(side);
  }

  function undo(side){
    const s = state[side];
    if(s.history.length === 0) return;
    const prev = s.history.pop();
    s.l1 = prev.l1; s.l2 = prev.l2; s.dq = prev.dq;
    render(side);
  }

  sides.forEach(side => {
    ids[side].btns.forEach(btn => {
      btn.addEventListener('click', () => {
        const action = btn.dataset.action;
        if(action === 'l1minus') l1Minus(side);
        if(action === 'l2plus') l2Plus(side);
        if(action === 'dq') dq(side);
      });
    });
    ids[side].undo.addEventListener('click', () => undo(side));
  });

  el('resetAllBtn').addEventListener('click', () => {
    if(!confirm('Reset both scores? This clears Level 1, Level 2 and DQ status.')) return;
    sides.forEach(side => {
      state[side] = { l1: L1_MAX, l2: 0, dq:false, history:[] };
      render(side);
    });
  });

  sides.forEach(render);
})();
</script>
</body>
</html>
